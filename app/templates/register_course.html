{% extends "base.html" %}
{% block title %}Register for Course{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}
{% block content %}
<div class="container col-md-6 offset-md-3">
  <h3 class="text-center mb-4">Register for a Course</h3>
  <form method="POST">
    {{ form.hidden_tag() }}
    <div class="mb-3">
      {{ form.course.label(class="form-label") }}
      {{ form.course(class="form-control") }}
    </div>
    <button type="submit" class="btn btn-success w-100">Register</button>
  </form>
</div>
<p><a href="{{ url_for('app_views.student_dashboard') }}">Back to Dashboard</a></p>
{% endblock %}
